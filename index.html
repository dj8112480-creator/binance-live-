<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binance Master AIO Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif; background-color: #0b0e11; color: #eaecef; padding: 15px 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1 { color: #f3ba2f; font-size: 20px; text-align: center; margin-bottom: 4px; }
        .sub { font-size: 11.5px; color: #848e9c; text-align: center; margin-bottom: 16px; }
        
        /* Master Control Panel */
        .panel { width: 100%; max-width: 410px; background: #1e2026; padding: 16px; border-radius: 12px; border: 1px solid #2b3139; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .sec-title { font-size: 12.5px; font-weight: bold; color: #f3ba2f; margin-bottom: 12px; border-bottom: 1px solid #2b3139; padding-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .fg { margin-bottom: 10px; display: flex; flex-direction: column; }
        label { font-size: 11px; color: #848e9c; margin-bottom: 3px; font-weight: 500; }
        input { padding: 8px 10px; border-radius: 6px; border: 1px solid #474f59; background: #181a20; color: white; font-size: 13px; }
        .btn-sync { width: 100%; padding: 12px; background: #f3ba2f; color: #181a20; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
        .btn-sync:hover { background: #dfa516; }

        /* Multi-View Route Tabs (Simulating 5 separate files) */
        .route-tabs { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; max-width: 410px; background: #1e2026; padding: 5px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #2b3139; }
        .rt-btn { flex: 1; min-width: 48%; padding: 8px 4px; font-size: 11px; font-weight: bold; text-align: center; border-radius: 6px; cursor: pointer; color: #848e9c; background: transparent; border: 1px solid transparent; transition: all 0.2s; }
        .rt-btn.active { background: #f3ba2f; color: #181a20; border-color: #f3ba2f; }
        .rt-btn.full-width { min-width: 100%; }

        /* Direct Virtual Link Bar */
        .virtual-links-bar { width: 100%; max-width: 410px; background: #181a20; padding: 10px; border-radius: 8px; border: 1px dashed #2b3139; margin-bottom: 16px; font-size: 11px; color: #848e9c; }
        .virtual-links-bar span { color: #f3ba2f; font-weight: bold; }

        /* iPhone Canvas Frame */
        .iphone-frame { width: 100%; max-width: 410px; border-radius: 14px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.8); position: relative; min-height: 580px; transition: background 0.2s; }
        
        /* iPhone Status Bar */
        .iphone-status-bar { height: 36px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 13px; font-weight: 600; }
        .sb-light { background: #ffffff; color: #000000; }
        .sb-dark { background: #181a20; color: #ffffff; }
        .sb-right { display: flex; align-items: center; gap: 5px; font-size: 11.5px; }
        .bat-box { width: 22px; height: 11px; border-radius: 2.5px; display: flex; align-items: center; padding: 1px; position: relative; }
        .bat-box-light { border: 1px solid #000000; }
        .bat-box-dark { border: 1px solid #ffffff; }
        .bat-fill { height: 100%; border-radius: 0.5px; }
        .bat-fill-light { background: #000000; }
        .bat-fill-dark { background: #ffffff; }

        /* Route View Container */
        .r-view { display: none; padding: 16px; width: 100%; }
        .r-view.active { display: block; }

        /* ROUTE 1: crypto-wallet.html (Light Theme, No Name) */
        #rv-wallet { background: #ffffff; color: #000000; }
        .w-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .w-logo-box { background: #fcd435; width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
        .w-pill { display: flex; background: #eaecef; padding: 2px; border-radius: 6px; }
        .w-pill div { padding: 4px 10px; font-size: 12px; border-radius: 4px; }
        .w-pill .active-p { background: #ffffff; color: #1e2026; font-weight: bold; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .w-addr { font-size: 12px; color: #929aa5; margin-bottom: 4px; }
        .w-big-bal { font-size: 34px; font-weight: 800; letter-spacing: -0.6px; margin-bottom: 2px; }
        .w-growth { color: #0ecb81; font-size: 12.5px; font-weight: 600; margin-bottom: 18px; }
        .w-grid { display: flex; justify-content: space-between; text-align: center; margin-bottom: 20px; font-size: 11.5px; font-weight: 500; color: #1e2026; }
        .w-grid-icon { width: 44px; height: 42px; background: #f5f5f5; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 4px; }
        .w-promo { background: #fef8e6; border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #000000; }
        .w-asset-head { font-size: 14px; font-weight: 700; border-bottom: 2px solid #f5f5f5; padding-bottom: 6px; margin-bottom: 12px; color: #1e2026; }
        .w-token { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }

        /* ROUTE 2: binance-deposit-email.html (Gmail Dark) */
        #rv-email { background: #121214; color: #ffffff; min-height: 520px; }
        .gm-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 17px; }
        .gm-sub { font-size: 18px; font-weight: 450; line-height: 1.35; margin-bottom: 16px; }
        .gm-sender { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .gm-av { width: 38px; height: 38px; background: #b366ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: white; }
        .b-mail-card { background: #1e2026; border-radius: 6px; overflow: hidden; border: 1px solid #2b3139; }
        .b-mail-head { padding: 16px; text-align: center; background: #181a20; color: #f3ba2f; font-weight: 800; font-size: 16px; letter-spacing: 1.2px; }
        .b-mail-body { padding: 20px 16px; }
        .btn-mail { display: inline-block; background: #f3ba2f; color: #181a20; font-weight: 700; padding: 11px 20px; border-radius: 4px; font-size: 13px; margin-top: 14px; text-decoration: none; }

        /* ROUTE 3: withdrawal-details.html (Hero View) */
        #rv-with-hero { background: #181a20; color: #ffffff; min-height: 520px; }
        .with-top { padding: 4px 0 12px 0; font-weight: 600; font-size: 15px; border-bottom: 1px solid #2b3139; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .hero-num-box { text-align: center; padding: 15px 0 20px 0; }
        .hero-minus { font-size: 30px; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
        .hero-comp { color: #0ecb81; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 12px; }
        .with-list { display: flex; flex-direction: column; gap: 14px; font-size: 13.5px; margin-top: 10px; }
        .with-row { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #2b3139; padding-bottom: 12px; }
        .with-lbl { color: #848e9c; }
        .with-val { color: #ffffff; font-weight: 500; text-align: right; word-break: break-all; max-width: 230px; font-family: monospace; font-size: 12.5px; }
        .with-val-text { font-family: sans-serif; }
        .btn-with-action { display: block; text-align: center; background: #f3ba2f; color: #181a20; font-weight: 700; padding: 13px; border-radius: 8px; font-size: 14px; margin-top: 25px; }

        /* ROUTE 4: withdrawal-details (1).html (List/Backup View) */
        #rv-with-list { background: #181a20; color: #ffffff; min-height: 520px; }
        .backup-center { text-align: center; padding: 25px 0; border-bottom: 1px solid #2b3139; }
        .backup-amt { font-size: 32px; font-weight: 700; color: #ffffff; }
    </style>
</head>
<body>

    <h1>Binance Master AIO Engine</h1>
    <div class="sub">5-in-1 Unified Synchronized Simulator (Replicates All Links)</div>
    
    <!-- Virtual Link Emulator Status -->
    <div class="virtual-links-bar">
        Active Route URL: <span id="currentRouteDisplay">/binance2/crypto-wallet.html</span>

    <div class="panel">
